<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="js.js" defer></script>

</head>

<body>
    <p id="turn" style="text-align: left;">턴 없음</p>
    <div id="labapp">
        <div id="chessboard">
            <canvas id="arrowCanvas"></canvas>
            <svg id="arrowLayer">
                <defs>
                    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">

                        <path d="M0,0 L12,6 L0,12 Z" fill="red" />
                    </marker>
                </defs>
            </svg>
            <div data-x="0" data-y="7" class="square light"></div>
            <div data-x="1" data-y="7" class="square dark"></div>
            <div data-x="2" data-y="7" class="square light"></div>
            <div data-x="3" data-y="7" class="square dark"></div>
            <div data-x="4" data-y="7" class="square light"></div>
            <div data-x="5" data-y="7" class="square dark"></div>
            <div data-x="6" data-y="7" class="square light"></div>
            <div data-x="7" data-y="7" class="square dark"></div>
            <div data-x="0" data-y="6" class="square dark"></div>
            <div data-x="1" data-y="6" class="square light"></div>
            <div data-x="2" data-y="6" class="square dark"></div>
            <div data-x="3" data-y="6" class="square light"></div>
            <div data-x="4" data-y="6" class="square dark"></div>
            <div data-x="5" data-y="6" class="square light"></div>
            <div data-x="6" data-y="6" class="square dark"></div>
            <div data-x="7" data-y="6" class="square light"></div>
            <div data-x="0" data-y="5" class="square light"></div>
            <div data-x="1" data-y="5" class="square dark"></div>
            <div data-x="2" data-y="5" class="square light"></div>
            <div data-x="3" data-y="5" class="square dark"></div>
            <div data-x="4" data-y="5" class="square light"></div>
            <div data-x="5" data-y="5" class="square dark"></div>
            <div data-x="6" data-y="5" class="square light"></div>
            <div data-x="7" data-y="5" class="square dark"></div>
            <div data-x="0" data-y="4" class="square dark"></div>
            <div data-x="1" data-y="4" class="square light"></div>
            <div data-x="2" data-y="4" class="square dark"></div>
            <div data-x="3" data-y="4" class="square light"></div>
            <div data-x="4" data-y="4" class="square dark"></div>
            <div data-x="5" data-y="4" class="square light"></div>
            <div data-x="6" data-y="4" class="square dark"></div>
            <div data-x="7" data-y="4" class="square light"></div>
            <div data-x="0" data-y="3" class="square light"></div>
            <div data-x="1" data-y="3" class="square dark"></div>
            <div data-x="2" data-y="3" class="square light"></div>
            <div data-x="3" data-y="3" class="square dark"></div>
            <div data-x="4" data-y="3" class="square light"></div>
            <div data-x="5" data-y="3" class="square dark"></div>
            <div data-x="6" data-y="3" class="square light"></div>
            <div data-x="7" data-y="3" class="square dark"></div>
            <div data-x="0" data-y="2" class="square dark"></div>
            <div data-x="1" data-y="2" class="square light"></div>
            <div data-x="2" data-y="2" class="square dark"></div>
            <div data-x="3" data-y="2" class="square light"></div>
            <div data-x="4" data-y="2" class="square dark"></div>
            <div data-x="5" data-y="2" class="square light"></div>
            <div data-x="6" data-y="2" class="square dark"></div>
            <div data-x="7" data-y="2" class="square light"></div>
            <div data-x="0" data-y="1" class="square light"></div>
            <div data-x="1" data-y="1" class="square dark"></div>
            <div data-x="2" data-y="1" class="square light"></div>
            <div data-x="3" data-y="1" class="square dark"></div>
            <div data-x="4" data-y="1" class="square light"></div>
            <div data-x="5" data-y="1" class="square dark"></div>
            <div data-x="6" data-y="1" class="square light"></div>
            <div data-x="7" data-y="1" class="square dark"></div>
            <div data-x="0" data-y="0" class="square dark"></div>
            <div data-x="1" data-y="0" class="square light"></div>
            <div data-x="2" data-y="0" class="square dark"></div>
            <div data-x="3" data-y="0" class="square light"></div>
            <div data-x="4" data-y="0" class="square dark"></div>
            <div data-x="5" data-y="0" class="square light"></div>
            <div data-x="6" data-y="0" class="square dark"></div>
            <div data-x="7" data-y="0" class="square light"></div>
                    </div>

        <!-- 오른쪽 상점 -->
        <div id="shopPanel" style="display: none;">

            <div class="shop-header">
                <h3>🛒 기물 상점</h3>
                <div class="shop-money">
                    🪙 <span id="playerGold">100</span>
                </div>
            </div>

            <div class="shop-tabs">
                <button class="shop-tab active">기물</button>
                <button class="shop-tab" disabled>강화</button>
                <button class="shop-tab" disabled>특수</button>
            </div>

            <div class="shop-items">

                <div class="shop-item">
                    <div class="shop-piece">P</div>
                    <div class="shop-info">
                        <strong>폰</strong>
                        <span>기본 기물</span>
                        <b>🪙 10</b>
                    </div>
                    <button class="shop-buy-button" data-piece="p" >구매</button>
                </div>

                <div class="shop-item">
                    <div class="shop-piece">N</div>
                    <div class="shop-info">
                        <strong>나이트</strong>
                        <span>기동형 기물</span>
                        <b>🪙 30</b>
                    </div>
                    <button class="shop-buy-button" data-piece="n" >구매</button>
                </div>

                <div class="shop-item">
                    <div class="shop-piece">B</div>
                    <div class="shop-info">
                        <strong>비숍</strong>
                        <span>대각선 특화 기물</span>
                        <b>🪙 30</b>
                    </div>
                    <button class="shop-buy-button" data-piece="b" >구매</button>
                </div>

                <div class="shop-item">
                    <div class="shop-piece">R</div>
                    <div class="shop-info">
                        <strong>룩</strong>
                        <span>원거리 기물</span>
                        <b>🪙 40</b>
                    </div>
                    <button class="shop-buy-button" data-piece="r" >구매</button>
                </div>

            </div>

            <div class="shop-footer">
                <span>구매한 기물은 이후 배치할 수 있습니다.</span>
            </div>

        </div>
        </div>
        
    </div>
    <button onclick="delchess()" class="btn btn-outline-secondary">기권</button>
    
    <div style="text-align: left">
        <h4>공격 상성</h4>
        <h5>단거리 기물은 원거리 딜에 강하고, 재빠른 성향에 약합니다.</h5>
        <h5>원거리 기물은 탱킹을 뚫기 어려워 하고, 재빠른 성향에 강합니다.</h5>
        <h5>이레귤러 기물은 근접을 교란시키고, 원거리 제압에 약합니다.</h5>
        <h4>수비 상성</h4>
        <h5>공격적/수비적/재빠른/보호받는</h5>
    </div>

</body>

</html>
